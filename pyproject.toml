[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditory-data-suite"
version = "2.0.0"
description = "Auditory neural mapping analysis CLI and GUI tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "blinker",
  "cmocean",
  "colorama",
  "kivy>=2.3",
  "kivy-garden.matplotlib",
  "llvmlite",
  "matplotlib",
  "neo",
  "numba",
  "numpy",
  "openpyxl",
  "opencv-python",
  "packaging",
  "pandas",
  "Pillow",
  "scikit-image",
  "scipy",
  "shapely",
  "tinydb",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[project.scripts]
map-analysis = "map_analysis:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["stim_types"]
py-modules = [
  "Field_Selection_GUI",
  "analysis_admin",
  "analysis_functions",
  "bayesian_bins",
  "brainware",
  "cli_utils",
  "compat",
  "db_adapter",
  "dialogs",
  "digit_ocr",
  "field_definitions",
  "final_file",
  "geometry",
  "gui_autosave",
  "logging_utils",
  "map_analysis",
  "runtime_config",
  "site_model",
  "subject_analysis",
  "tc_analysis",
  "voronoi_picker",
]

[tool.setuptools.data-files]
resources = ["resources/OCR-A.otf"]
demo = [
  "demo/demo_config.json",
  "demo/tones_list.csv",
  "demo/voronoi_picker_demo.py",
]
"demo/data" = ["demo/data/*.src"]
"demo/img" = ["demo/img/*"]
"demo/output" = ["demo/output/analyzed_demo.json"]
